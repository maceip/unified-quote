name: release

# Publication is held until hardware acceptance covers this exact revision.
# Set UQ_HARDWARE_ACCEPTED_SHA only after recording the joint acceptance pass,
# then dispatch this workflow. A build/provenance result is not hardware proof.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.UQ_HARDWARE_ACCEPTED_SHA == github.sha
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build uq
        run: cargo build --locked --release -p unified-quote --features gpu --bin uq --target ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: v2/google-attestation/go.sum

      - name: Build Google adapter
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [[ '${{ runner.os }}' == Windows ]]; then suffix=.exe; fi
          ./v2/google-attestation/build.sh "dist/uq-google-attestation-${{ matrix.target }}$suffix"

      - name: Stage (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          out="uq-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/uq" "dist/$out"
          ( cd dist && shasum -a 256 "$out" > "$out.sha256" )
          adapter="uq-google-attestation-${{ matrix.target }}"
          ( cd dist && shasum -a 256 "$adapter" > "$adapter.sha256" )

      - name: Stage (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          $out = "uq-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/uq.exe" "dist/$out"
          (Get-FileHash "dist/$out" -Algorithm SHA256).Hash.ToLower() + "  $out" | Set-Content "dist/$out.sha256"
          $adapter = "uq-google-attestation-${{ matrix.target }}.exe"
          (Get-FileHash "dist/$adapter" -Algorithm SHA256).Hash.ToLower() + "  $adapter" | Set-Content "dist/$adapter.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: uq-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: vars.UQ_HARDWARE_ACCEPTED_SHA == github.sha
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Build provenance for the binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/uq-*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: uq v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*
