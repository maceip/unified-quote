[package]
name = "unified-quote"
version = "0.1.0"
edition = "2021"
description = "One attestation receipt across cloud TEEs: EAT quote format + verifier"
repository = "https://github.com/ZUNFTMAX/zmax-universal-attestations"
homepage = "https://github.com/ZUNFTMAX/zmax-universal-attestations"
readme = "GPU.md"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "uq"
path = "src/main.rs"

[features]
default = ["nitro", "sev-snp", "tdx"]
nitro = ["dep:serde_cbor", "dep:aws-nitro-enclaves-nsm-api", "dep:p384", "dep:rsa", "dep:aes", "dep:cbc"]
sev-snp = ["dep:p384", "dep:rsa"]
tdx = []
mobile = ["dep:p384", "dep:rsa"]
desktop = ["mobile"]
# Native NVIDIA collection, certificate/RIM validation and composite policy.
# NVML is loaded at runtime; no CUDA SDK or NVIDIA verifier is linked.
gpu = ["dep:libloading", "dep:p384", "dep:rsa", "dep:x509-ocsp", "dep:sha1", "dep:roxmltree", "dep:bergshamra-c14n", "dep:bergshamra-xml", "dep:uppsala"]

[dependencies]
# Core
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_bytes = "0.11"
ciborium = "0.2"
thiserror = "2"
anyhow = "1"
libloading = { version = "0.8", optional = true }
x509-ocsp = { version = "0.2.1", features = ["std"], optional = true }
# SHA-1 is used only for RFC 6960 issuer/responder identifiers, never signatures.
sha1 = { version = "0.10", optional = true }
roxmltree = { version = "0.21.1", optional = true }
bergshamra-c14n = { version = "=0.9.2", optional = true }
bergshamra-xml = { version = "=0.9.2", optional = true }
uppsala = { version = "=0.10.1", optional = true }

# Crypto verification
p384 = { version = "0.13", features = ["ecdsa"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["verifying"] }
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std"] }
spki = "0.7"
base64 = "0.22"
rsa = { version = "0.9", optional = true }
# Google Authenticode format/digest implementation; cryptographic admission is
# performed by boot::authenticode with explicit verifier-owned trust and policy.
authenticode = { version = "=0.6.0", default-features = false, features = ["std"] }
# Approved RustCrypto CMS parser; direct use enforces bounded exact DER/profile
# checks before Google's parser, which also accepts padded signature buffers.
cms = { version = "=0.2.3", default-features = false, features = ["std"] }

# Nitro. The NSM device crate is Unix-only; keep it target-scoped so
# verifier-only builds still compile on developer workstations.
serde_cbor = { version = "0.11", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["std", "block-padding"], optional = true }

# AMD KDS cert fetch
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

# ACME (Let's Encrypt TLS-ALPN-01)
instant-acme = "0.8"
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
aws-nitro-enclaves-nsm-api = { version = "0.5", features = ["nix"], optional = true }

# TEE device ioctls and vsock are Unix-only.
nix = { version = "0.29", features = ["ioctl"] }
libc = "0.2"
